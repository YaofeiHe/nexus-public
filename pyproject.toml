[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "Codex-first workflow kernel and orchestrator for Chinese internet discovery workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nexus = "nexus.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
